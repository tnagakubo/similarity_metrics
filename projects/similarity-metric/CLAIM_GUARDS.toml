type = "forbid"
pattern = "diminished slowly|Convergence is slow near the boundary"
known_bad = "fad1010"
# pending removed 2026-10-12 (Katrina): fix applied, guard passes on the working tree
note = "S1 の bias は n 倍化ごとに 1.40 倍で落ちる = n^{-1/2} そのもの。『遅い』ではない"

[[guard]]
