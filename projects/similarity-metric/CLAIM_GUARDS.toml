# Rewritten 2026-10-13 (D-20261012-3, Louis round 3 M15): the old stem forced "attain/sharp" into every sentence naming the constant, which produced the attainment-as-reason wording that referee #2 rejected. Now: any "smallest valid" claim must name sharpness over the class.

[[guard]]
id = "REF-M1-forbid-constant-distinguishes"
finding = "review_response/REFEREE_20261011.md M1"
type = "forbid"
pattern = "What distinguishes equation|clinical sources do not report"
known_bad = "fad1010"
# pending removed 2026-10-12 (Katrina): fix applied, guard passes on the working tree
note = "『定数が区別する』は false as stated（同じ文で名指す W₂ の bound が同じ定数を持つ）"

[[guard]]
id = "REF-M1-require-attainment"
finding = "review_response/REFEREE_20261011.md M1"
type = "require"
scope = "section:sec:nabcd_metric"
pattern = "sharp when the slope is the only restriction|attained by"
known_bad = "fad1010"
# pending removed 2026-10-12 (Katrina): fix applied, guard passes on the working tree
note = "L* = Δ_clin/W₁ が『最小の slope』であるのは bound が attained だから — §2.2 に明記"
# Rewritten 2026-10-13 (D-20261012-3, Louis round 3 M15): section 2.2 must state the KR sharpness (or its attainment by tau*); it is no longer the reason for adoption.

[[guard]]
id = "REF-M2-n100-needs-scale"
finding = "review_response/REFEREE_20261011.md M2"
type = "proximity"
stem = "100 patients per region|from 100 per region|from 100 patients"
qualifier = "sigma|standard deviation|\\bSD\\b|noncentrality|0\\.4|sampling standard deviation"
# 2026-10-12 Louis: stem narrowed — the grid "25--100 per region" matched the old stem; qualifier admits "SD" as a word
known_bad = "fad1010"
# pending removed 2026-10-12 (Katrina): fix applied, guard passes on the working tree
