type = "require"
scope = "section:sec:study1_selection"
pattern = "Sets? 1|Gaussian"
# 2026-10-12 Louis: "all six cells of Sets 1 and 2" satisfies the intent
known_bad = "fad1010"
# pending removed 2026-10-12 (Katrina): fix applied, guard passes on the working tree
note = "W₁ vs KS の required n を 13 cell すべてで報告（11 W₁ fewer / 1 overlap / 1 KS fewer）"

[[guard]]
id = "REF-M4-rank-needs-uncertainty"
finding = "review_response/REFEREE_20261011.md M4"
type = "proximity"
scope = "section:sec:app_nabcd"
stem = "middle of each ranking|smallest value|rank(ed|s|ing)? (by|on|within)"
qualifier = "rank interval|resampl|bootstrap|not resolved"
known_bad = "fad1010"
# pending removed 2026-10-12 (Katrina): fix applied, guard passes on the working tree
note = "中位の rank は 10 位分ぶれる（P(R6<R5, SBP) = 0.50）。順位を書く文は不確かさも書く"

[[guard]]
id = "REF-M4-null-floor-is-a-test"
finding = "review_response/REFEREE_20261011.md M4"
type = "proximity"
scope = "section:sec:app_operability"
stem = "unresolved"
qualifier = "test|level|0\\.05|5 ?%|one-sided"
known_bad = "fad1010"
# pending removed 2026-10-12 (Katrina): fix applied, guard passes on the working tree
note = "null floor は F₁ = F₂ の片側 5% 検定を 30 回適用したもの — そう名指す"

[[guard]]
id = "REF-M5-declare-omitted-methods"
finding = "review_response/REFEREE_20261011.md M5(a)"
type = "require"
scope = "section:sec:study1_design"
pattern = "representative-value|RV1|also (ran|evaluated|examined)|not reported|omit"
known_bad = "fad1010"
# pending removed 2026-10-12 (Katrina): fix applied, guard passes on the working tree
note = "protocol と results にある RV1–RV3・harm・clustering task を、報告しないなら省略を一文で宣言する（ADEMP）"

[[guard]]
id = "REF-M5-cluster-discussion-needs-registered-result"
finding = "review_response/REFEREE_20261011.md M5(c)"
type = "proximity"
scope = "section:sec:discussion"
stem = "cluster analysis"
qualifier = "silhouette|number of groups|estimated k|ARI|not report"
known_bad = "fad1010"
# pending removed 2026-10-12 (Katrina): fix applied, guard passes on the working tree
