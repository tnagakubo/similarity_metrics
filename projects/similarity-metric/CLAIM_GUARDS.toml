type = "forbid"
scope = "section:sec:app_operability"
pattern = "separate question from the estimation criterion"
known_bad = "fad1010"
# pending removed 2026-10-12 (Katrina): fix applied, guard passes on the working tree
note = "null floor の解像と percentile coverage は同じ noncentrality が決める — 『別の問題』ではない"

[[guard]]
id = "REF-M2-near-nominal-needs-mcse"
finding = "review_response/REFEREE_20261011.md M2(a); Louis review C-09"
type = "proximity"
stem = "near-nominal"
qualifier = "Monte Carlo|MCSE|standard error|0\\.917|S5"
known_bad = "fad1010"
# pending removed 2026-10-12 (Katrina): fix applied, guard passes on the working tree
note = "S3–S7 n≥100 の 10 cell のうち 5 cell が自分の MCSE の 2 倍以上 0.95 を下回る（l.391 の規則）"

[[guard]]
id = "REF-M3-five-of-seven-needs-target"
finding = "review_response/REFEREE_20261011.md M3(c)"
type = "proximity"
stem = "five of (the )?seven"
qualifier = "AUC 0\\.9|0\\.9 target|discrimination target"
known_bad = "fad1010"
# pending removed 2026-10-12 (Katrina): fix applied, guard passes on the working tree
note = "shape-symmetric cell の順序は AUC 0.8 と 0.95 で逆転する — 比較は目標値を伴う"

[[guard]]
id = "REF-M3-forbid-summary-label-for-set4"
finding = "review_response/REFEREE_20261011.md M3(a)"
type = "forbid"
pattern = "configurations built to challenge summary measures|worlds built to challenge summary-based measures"
known_bad = "fad1010"
# pending removed 2026-10-12 (Katrina): fix applied, guard passes on the working tree
