# CLAIM_GUARDS.toml — similarity-metric（review findings → executable, mutation-tested guards）
# Evaluate:  python3 scripts/claim_guards.py projects/similarity-metric/CLAIM_GUARDS.toml --mutation
# Seeded 2026-10-11 from the Claude Science referee report (claude_science/referee_report.md,
# claude_science/verify_corrections.R §2b) and the 2026-10-11 Louis review. known_bad = 115b00a is the
# last revision before the M1–M5 corrections (8adf0e6); abstract guards use the 356-word abstract of
# the same revision (claude_science/README.md records its quantifier inversions).
# Owner: Louis（起票）/ Katrina（known_bad の検証）/ Donna（hook）。

[meta]
tex = "paper/per_em_W1_wiley.tex"
project = "similarity-metric"

# ---- journal ----------------------------------------------------------------------------------

[[guard]]
id = "abstract-length"
finding = "Statistics in Medicine: abstract ≤ 250 words"
type = "max_words"
scope = "abstract"
limit = 250
known_bad = "115b00a"
note = "abstract ≤ 250 words（inline math = 1 word）"

[[guard]]
id = "abstract-no-citation"
finding = "Statistics in Medicine: no citations in the abstract"
type = "forbid"
scope = "abstract"
pattern = "\\\\cite"
note = "abstract carries no \\cite"

# ---- M1: exclusivity of the heterogeneity bound (false as stated) -------------------------------

[[guard]]
id = "M1-exclusivity-unique"
finding = "claude_science/referee_report.md M1"
type = "forbid"
pattern = "unique theoretical connection"
literal = true
known_bad = "115b00a"
note = "W₁ の bound は unique ではない（KS にも TV(τ)·D_KS、W₂ にも L·W₂ がある）"

[[guard]]
id = "M1-exclusivity-none"
finding = "claude_science/referee_report.md M1"
type = "forbid"
pattern = "no theoretical connection"
literal = true
known_bad = "115b00a"
note = "EDF 統計に『理論的関連がない』と書かない"

[[guard]]
id = "M1-exclusivity-analogous"
finding = "claude_science/referee_report.md M1"
type = "forbid"
pattern = "cannot provide an analogous bound|lack any analogous property"
known_bad = "115b00a"
note = "『類似の bound を与えられない』は誤り"

[[guard]]
id = "M1-link-names-constant"
finding = "claude_science/referee_report.md M1（class guard）"
type = "proximity"
stem = "theoretical (link|connection)"
qualifier = "constant|specif|elicit|total variation|per-unit"
known_bad = "115b00a"
note = "理論的関連を主張する文は必ずその定数（elicitable constant）を名指す — 言い換えに耐える guard"

# ---- M2: L_clinical units ----------------------------------------------------------------------

[[guard]]
id = "M2-L-units"
finding = "claude_science/referee_report.md M2"
type = "forbid"
pattern = "percentage points of 30-day mortality per year"
literal = true
known_bad = "115b00a"
note = "L_clinical は proportion scale。『percentage points … per year』で定義しない"

# ---- M4: R4 'balanced across both modifiers' (age-unresolved) ----------------------------------

[[guard]]
id = "M4-R4-balanced"
finding = "claude_science/referee_report.md M4"
type = "forbid"
pattern = "balanced across both modifiers|balanced ranking on both modifiers"
known_bad = "115b00a"
note = "age が unresolved の partner を『両 modifier で balanced』と書かない"

# ---- abstract compression（quantifier inversion / qualifier drop） ----------------------------

[[guard]]
id = "abstract-no-universal-over-worlds"
finding = "claude_science/README.md『Compression dropped the qualifiers』"
type = "forbid"
scope = "abstract"
pattern = "\\bwherever\\b|\\bin every world\\b|\\balways\\b"
known_bad = "file:review_response/known_bad/abstract_compressed_20260921.tex"
note = "abstract の existential claim を universal に圧縮しない"

[[guard]]
id = "abstract-coverage-qualified"
finding = "claude_science/README.md『Compression dropped the qualifiers』; C-09"
type = "proximity"
scope = "abstract"
stem = "coverage"
qualifier = "all but|non-negligible|for .*differences|from 100|at n"
known_bad = "file:review_response/known_bad/abstract_compressed_20260921.tex"
note = "coverage の文は必ず限定句を伴う（S1 は構造的に 0、S2 は n=50 で 0.703）"

# ---- Louis review 2026-10-11（feedback_review_recurrence_patterns） ---------------------------

[[guard]]
id = "no-indistinguishable"
finding = "Louis review 2026-10-11（区間 overlap ≠ 同等）"
type = "forbid"
pattern = "\\bindistinguishable\\b"
known_bad = "f8c01f7"
note = "Monte Carlo 区間が重なる = 『区別できなかった』であって『同等』ではない"

[[guard]]
id = "no-significant"
finding = ".claude/rules/paper-writing.md（estimation-centered）"
type = "forbid"
pattern = "\\b(non-?)?significant(ly)?\\b"
note = "estimation-centered: significance 語を使わない"

[[guard]]
id = "E17-not-recommends"
finding = "memory/feedback_tak_feedback_patterns.md（E17 は describes / notes / permits）"
type = "forbid"
pattern = "E17[^.]{0,80}\\brecommends?\\b|\\brecommends?\\b[^.]{0,80}E17"
note = "ICH E17 に recommends を使わない"

[[guard]]
id = "simulation-not-proves"
finding = ".claude/rules/paper-writing.md"
type = "forbid"
scope = "section:simulation|study|results"
pattern = "\\bprove[sd]?\\b|\\bguarantee[sd]?\\b"
note = "simulation の節で proves / guarantees を使わない"

[[guard]]
id = "no-emph"
finding = "memory/feedback_paper_no_emph（本文で \\emph を使わない）"
type = "forbid"
pattern = "\\\\emph\\{"
note = "本文で \\emph{} を使わない"

