<h2>地域ごとの距離を、区間つきで並べる</h2>
<div class="figbox"><img src="/_blob/5d167106c13aac63d2ab47a56a938dc9" alt="Region 8 と 15 の地域の W₁ と 95% 信頼区間のフォレストプロット。年齢と収縮期血圧の 2 パネル" style="width:1120px;height:560px;object-fit:contain"></div>
<p class="cap">図 4：Region 8 と各地域の W₁ と 95% 区間。(A) 年齢（年）、(B) 収縮期血圧（mmHg）。† は unresolved、点線は参照距離（1 年、5 mmHg）</p>
<aside>これが応用の中心となる図です。左が年齢、右が収縮期血圧で、Region 8 と各地域の W₁ を、95% 信頼区間つきで小さい順に並べています。短剣の印が unresolved の距離、点線が参照距離です。隣り合う地域の区間は多くが重なっているので、この並びを確定した順位として読むことはしません。読むのは、一つひとつの距離とその区間です。</aside>
