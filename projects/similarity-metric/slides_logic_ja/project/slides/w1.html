<h2>W₁ は、二つの累積分布関数に挟まれた面積</h2>
<div class="figbox"><img src="/_blob/b3a676e3399a7ca87a7549fde2183151" alt="二地域の確率密度（A）と累積分布関数（B）。B では二つの曲線に挟まれた領域が塗られている" style="width:1260px;height:540px;object-fit:contain"></div>
<p class="cap">図 1：右に歪んだ地域 1（ガンマ分布）と対称な地域 2（正規分布）。(A) 確率密度、(B) 累積分布関数。塗られた面積が W₁</p>
<aside>W₁ の定義は直感的です。二つの地域の累積分布関数を描いて、その間に挟まれた面積が W₁ です。右のパネルの塗られた部分がそれに当たります。同じ量は、分位点の差を平均したもの、あるいは一方の分布をもう一方に運ぶための最小の移動量、とも表せます。二つの分布が完全に一致するときだけゼロになるので、平均が同じでも、広がりや歪みが違えば正の値になります。これが要請の一つ目に対応します。</aside>
